[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-ml-pipeline"
version = "0.1.0"
description = "Research slice: leakage-safe sklearn tabular pipelines with grouped CV and calibration."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "M.Varun" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
